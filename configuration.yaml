api:
  host: 0.0.0.0
  port: 10006
  debug: true
pipeline:
  batch_time_budget: 14400
  prompt_timeout: 600.0
  use_planner: false
  render_from_object: true
  refinement_enabled: true
benchmark: true
warmup: true
llm_clients:
  openrouter:
    enabled: false
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  coder-instance:
    enabled: true
    base_url: http://localhost:8001/v1
    api_key: local
    vllm:
      model: "Tooony133/Qwen-3.6-27B-SkinnyPete"
      revision: "2d811e9cb9a74f311682cdcb68aa2404da6974a0"
      gpu_ids: 0,1,2
      tensor_parallel_size: 1
      data_parallel_size: 3
      vllm_bin: /opt/vllm-coder-env/bin/vllm
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 256
      extra_args:
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
  judge-critic-instance:
    enabled: true
    base_url: http://localhost:8002/v1
    api_key: local
    vllm:
      model: "zai-org/GLM-4.6V-Flash"
      revision: "411bb4d77144a3f03accbf4b780f5acb8b7cde4e"
      gpu_ids: '3'
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.5
      max_model_len: 81920
      max_num_seqs: 196
      vllm_bin: /opt/vllm-glm-env/bin/vllm
      trust_remote_code: true
      reasoning_parser: null
embedder:
  model_id: "Tooony133/dinov3-vits16-pretrain-lvd1689m"
  revision: "fc6921f7a0b44d5b33ab4482cfed5443db6ccd81"
  enabled: true
  batch_size: 8
