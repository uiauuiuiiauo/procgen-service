    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    enable_thinking: false
    multimodal: true
    ensemble_size: 48
    ensemble_temperature: 0.6
    providers:
      order: []
      allow_fallbacks: true
  patcher:
    workers: 64
    queue_size: 64
  critic:
