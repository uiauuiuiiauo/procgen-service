    model: "Tooony133/Qwen-3.6-27B-SkinnyPete"
    workers: 256
    queue_size: 128
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: medium
    enable_thinking: false
    providers:
      order: []
      allow_fallbacks: true
  coder:
    client: coder-instance
    model: "Tooony133/Qwen-3.6-27B-SkinnyPete"
    workers: 176
    queue_size: 128
    max_tokens: 24576
    temperature: 0.6
    top_p: 0.95
    top_k: 20
